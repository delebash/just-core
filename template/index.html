<!doctype html>
<html lang="en">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>">
    <!-- The family's CSP (app-structure §Q.5). The page talks to its own server — beside it on the
         desktop (http://127.0.0.1:17490), a paired device or a server over the network — so
         connect/img/media allow http(s); scripts stay 'self' only. In development Quasar's HMR also
         needs its websocket (the dev server listens on 127.0.0.1). The desktop shell sends its own,
         stricter CSP header for app://; both apply there. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'<% if (ctx.mode.capacitor) { %> 'wasm-unsafe-eval'<% } %>; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https:<% if (ctx.dev) { %> ws://localhost:* ws://127.0.0.1:*<% } %>; worker-src 'self' blob:;"
    />

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">

    <!-- The boot plate — shown before the JavaScript runs, so start-up is never a blank window
         (app-structure §11: no spinner, ever). It is the SAME image, with the same fit, as the
         layout's warm-start splash (layouts/MainLayout.vue .splash), so start-up is one
         continuous picture: this plate → the splash (while a model warms) → the app. App.vue
         removes it when Vue mounts; the boot file removes it if start-up fails. -->
    <style>
      #app-boot { position: fixed; inset: 0; z-index: 9999; overflow: hidden; background: #fafaf7; }
      #app-boot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    </style>
  </head>
  <body>
    <div id="app-boot"><img src="./src/assets/splash-plate.svg" alt="" /></div>
    <!-- quasar:entry-point -->
  </body>
</html>
